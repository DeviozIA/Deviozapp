spring.application.name=backend

# Configuración de la Base de Datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/login_bd?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456

# Configuración de JPA/Hibernate para la creación automática de tablas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración para permitir CORS (Comunicación entre frontend y backend)
spring.web.cors.enabled=true
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:4200,http://localhost:3000,http://localhost # Puedes ajustar esto más adelante si tu frontend usa un puerto diferente
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Deshabilitar CSRF para simplificar las peticiones RESTful
spring.security.csrf.disable=true

